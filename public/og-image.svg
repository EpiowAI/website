<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050507;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="orbGrad1" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="orbGrad2" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Floating orbs -->
  <circle cx="200" cy="150" r="200" fill="url(#orbGrad1)"/>
  <circle cx="1000" cy="480" r="250" fill="url(#orbGrad2)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(168, 85, 247, 0.05)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Brain icon circle -->
  <circle cx="180" cy="315" r="80" fill="rgba(168, 85, 247, 0.15)" stroke="url(#primaryGrad)" stroke-width="3"/>

  <!-- Brain icon simplified -->
  <path d="M 160 295 Q 160 280 175 280 Q 185 280 190 290 Q 195 280 205 280 Q 220 280 220 295 L 220 320 Q 220 335 205 340 Q 195 340 190 330 Q 185 340 175 340 Q 160 340 160 325 Z"
        fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="175" cy="300" r="2" fill="#a855f7"/>
  <circle cx="190" cy="305" r="2" fill="#06b6d4"/>
  <circle cx="205" cy="300" r="2" fill="#ec4899"/>
  <path d="M 175 300 L 190 305 L 205 300" stroke="url(#primaryGrad)" stroke-width="1.5" fill="none"/>

  <!-- Brand name -->
  <text x="300" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="url(#primaryGrad)">EPIOW</text>

  <!-- Tagline -->
  <text x="300" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="600" fill="#9ca3af">The Future of Intelligent Systems</text>

  <!-- Subtitle -->
  <text x="300" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#6b7280">Next-generation AI solutions for enterprise</text>

  <!-- Tech badges -->
  <rect x="300" y="420" width="140" height="36" rx="18" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1"/>
  <text x="370" y="444" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#a855f7" text-anchor="middle">Neural AI</text>

  <rect x="455" y="420" width="140" height="36" rx="18" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1"/>
  <text x="525" y="444" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#06b6d4" text-anchor="middle">Edge Computing</text>

  <rect x="610" y="420" width="140" height="36" rx="18" fill="rgba(236, 72, 153, 0.15)" stroke="rgba(236, 72, 153, 0.3)" stroke-width="1"/>
  <text x="680" y="444" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ec4899" text-anchor="middle">MLOps</text>

  <!-- Decorative line -->
  <line x1="300" y1="490" x2="500" y2="490" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Stats -->
  <text x="300" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#6b7280">99.9% Uptime</text>
  <circle cx="435" cy="525" r="2" fill="#6b7280"/>
  <text x="450" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#6b7280">&lt;100ms Response</text>
  <circle cx="605" cy="525" r="2" fill="#6b7280"/>
  <text x="620" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#6b7280">24/7 AI Monitoring</text>
</svg>
